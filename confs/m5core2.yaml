substitutions:
  devicename: m5core2
  upper_devicename: M5Core2
  friendly_name: "M5Core2" #Core2
  esphome_name: "m5core2"
  sensor_update: "10s" #Usually 60s but shortened for demo purposes
  uart_rx_pin: 32
  uart_tx_pin: 33

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-core2
  framework:
    type: esp-idf
    version: recommended
    # Custom sdkconfig options
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
      CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: y
  flash_size: 16MB # Need to manually override defaults so M5STACK FIRE memory is correct

uart:
  id: uart_ecodan
  rx_pin:
    number: GPIO${uart_rx_pin}
    mode:
      input: true
      pullup: true
  tx_pin:
    number: GPIO${uart_tx_pin}
    mode:
      output: true
  baud_rate: 2400
  parity: EVEN
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

psram: #Need to include this so logs will display PSRAM detected, note only 4MB detected even though 8MB exists (probably because himem not implemented)
  mode: quad
  speed: 80MHz

api:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
#    - ssid: "Technea"
#      password: "61663824"

  ap:
    ssid: $devicename Fallback Hotspot
    password: !secret wifi_password

captive_portal:

web_server:
  port: 80

# Enable logging
logger:
  logs:
    component: DEBUG 

# Define I/O: I²C and SPI
i2c:
  id: bus_internal
  sda: 21
  scl: 22
  scan: true

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 38

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [ axp192, module4relay ]
    refresh: 0s

axp192:
  id: axp192_pmu
  i2c_id: bus_internal

# Define the module
module4relay:
#  i2c_id: bus_internal
#  address: 0x26 # The typical I2C address for the 4-relay module


binary_sensor:
#Extends touchscreen area to detect the 3 extra marked 'button circles' on M5Core 2
  - platform: touchscreen
    name: Button A
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true

  - platform: touchscreen
    name: Button B
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true

  - platform: touchscreen
    name: Button C
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true

sensor:
# PMU
  - platform: axp192
    update_interval: ${sensor_update}
    id: axp192_sensor
    # Optional calibration settings for battery level calculation, suggest chart your own device battery voltage and charge current to configure these
    battery_discharge_100pc_voltage: 3670 #Battery voltage level at which 100% charge is assumed (when not charging, or charging finished) in mV
    battery_discharge_0pc_voltage: 3000 #Battery voltage level at which 0% charge is assumed (when not charging, or charging finished) in mV
    battery_charge_100pc_current: 60 #Battery charge current at which 100% charge is assumed (when charging) in mA
    battery_charge_0pc_current: 420 #Battery charge current at which 0% charge is assumed (when charging) in mA
    battery_voltage:
      name: "Battery Voltage"
    usb_voltage:
      name: "USB Voltage"
    usb_current:
      name: "USB Current"
    vbus_voltage:
      name: "VBus Voltage"
    vbus_current:
      name: "VBus Current"
    internal_temperature:
      name: ${internal_esp_temperature}
      entity_category: diagnostic
      unit_of_measurement: "°C"
      device_class: temperature
    battery_power:
      name: "Battery Power"
    battery_charge_current:
      name: "Batt Charge I"
    battery_discharge_current:
      name: "Batt Discharge I"
    aps_voltage:
      name: "APS Voltage"
    battery_charging:
      id: charger_connected
      name: "Battery Charging"
    battery_level:
      name: "Battery Level"
      id: battery_percent
    usb_present:
      name: "USB Supply Present"
    usb_valid:
      name: "USB Supply Valid"
    vbus_present:
      name: "VBus Supply Present"
    vbus_valid:
      name: "VBus Supply Valid"
    battery_discharging:
      name: "Battery Discharging"
    over_temperature:
      name: "Over Temperature"
    battery_connected:
      name: "Battery Connected"
    battery_in_active_mode:
      name: "Battery in Active Mode"
    low_charge_current:
      name: "Charge current less than expected"

#Some useful standard sensors
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    icon: mdi:wifi
    name: "WiFi Signal dB"
    id: wifi_signal_db
    unit_of_measurement: "dB"
    update_interval: ${sensor_update}
    entity_category: "diagnostic"
                
  - platform: uptime
    name: ${esphome_name} Uptime

text_sensor:
  - platform: wifi_info
    ssid:
      icon: mdi:wifi
      id: wifi_ssid
      name: WiFi SSID
    dns_address:
      icon: mdi:wifi
      name: WiFi DNS Address
    ip_address:
      icon: mdi:wifi
      id: wifi_ip
      name: WiFi IP Address
      entity_category: "diagnostic"
  - platform: version
    name: "Firmware Version"
    id: firmware_version

output:
  - platform: axp192
    type: range
    channel: DCDC3
    id: lcd_backlight_output
    min_voltage: 2100
    max_voltage: 3500

  - platform: axp192
    channel: DLDO3
    id: vibration_motor
    voltage: 3300

  - platform: axp192
    channel: DLDO2
    id: lcd_power
    voltage: 3000

touchscreen:
  - platform: ft63x6
    id: touch
    # reset_pin:
    #   aw9523b: aw9523b_hub
    #   number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin:
      number: GPIO15
      ignore_strapping_warning: true
#     reset_pin:
#       aw9523b: aw9523b_hub
#       number: 9
    cs_pin: 
      number: GPIO5
      ignore_strapping_warning: true
    data_rate: 40MHz
    invert_colors: true
    id: m5core_lcd
    show_test_card: true

light:
  - platform: monochromatic
    id: display_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    entity_category: config
    output: lcd_backlight_output
    restore_mode: ALWAYS_ON #Always want to have a backlight on when we boot up
    default_transition_length: 250ms
  - platform: binary
    name: "Vibration"
    output: vibration_motor
  - platform: binary
    name: "LCD Power"
    output: lcd_power
    restore_mode: ALWAYS_ON #Always want to have a display on when we boot up

switch:
  - platform: axp192
    led_pwr:
      name: "Green LED"
    vibration_motor:
      name: "Vibration Motor"
  - platform: module4relay
    relay_1:
      name: "Module Relay Channel 1"
      restore_mode: RESTORE_DEFAULT_OFF
    relay_2:
      name: "Module Relay Channel 2"
      restore_mode: RESTORE_DEFAULT_OFF
    relay_3:
      name: "Module Relay Channel 3"
      restore_mode: RESTORE_DEFAULT_OFF
    relay_4:
      name: "Module Relay Channel 4"
      restore_mode: RESTORE_DEFAULT_OFF
